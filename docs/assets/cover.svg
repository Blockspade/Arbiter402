      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGlow)" />
