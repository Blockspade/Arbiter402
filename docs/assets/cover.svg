<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="60" cy="0" r="1.5" fill="#334155" fill-opacity="0.3" />
